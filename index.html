<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statue Maker for Bedrock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#1c1a17;--panel:#27241f;--line:#3d382f;--ink:#ece6d8;--dim:#a39b88;--accent:#d8a93b;--ok:#8fbf7a;--err:#e5766a}
@media (prefers-color-scheme:light){:root{--bg:#ece7dc;--panel:#f7f3ea;--line:#cfc6b2;--ink:#26231d;--dim:#6b6455;--accent:#9a6f0e;--ok:#3f7a2c;--err:#b3382c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:560px;margin:0 auto}
h1{font-size:2rem;margin:.5em 0 .1em;letter-spacing:-.01em}
p.sub{color:var(--dim);margin:0 0 1.4em}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
label{display:block;color:var(--dim);font-size:.9rem;margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;padding:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit}
input[type=file]{width:100%;color:var(--dim);font:inherit;font-size:.9rem}
.row{display:flex;gap:10px}.row>div{flex:1}
.mats{display:flex;gap:8px}
.mats label{flex:1;margin:0;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center;cursor:pointer}
.mats input{position:absolute;opacity:0}
.mats input:checked+span{color:var(--accent);font-weight:bold}
.mats label:has(input:checked){border-color:var(--accent)}
.mats label:has(input:focus-visible){outline:2px solid var(--accent)}
canvas{width:128px;height:128px;image-rendering:pixelated;border:1px solid var(--line);background:var(--bg);display:block;margin-top:10px}
button{width:100%;padding:14px;font:bold 1rem Georgia,serif;background:var(--accent);color:#1c1a17;border:0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#msg{min-height:1.5em;margin:10px 0 0;font-size:.92rem}
.ok{color:var(--ok)}.err{color:var(--err)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Statue Maker</h1>
<p class="sub">Pick a model, pick a material, download a Bedrock add-on with a spawn egg for your statue.</p>

<section>
<h2>1. Geometry</h2>
<label for="geo">Model file (.geo.json from Blockbench)</label>
<input id="geo" type="file" accept=".json,.geo.json,application/json">
<p id="geoInfo" class="sub" style="margin:8px 0 0;font-size:.9rem">No model chosen.</p>
</section>

<section>
<h2>2. Material</h2>
<div class="mats">
<label><input type="radio" name="mat" value="stone" checked><span>Stone</span></label>
<label><input type="radio" name="mat" value="gold"><span>Gold</span></label>
<label><input type="radio" name="mat" value="custom"><span>Custom</span></label>
</div>
<div id="customBox" class="hide">
<label for="tex">Texture file (.png)</label>
<input id="tex" type="file" accept="image/png">
</div>
<canvas id="prev" width="64" height="64" aria-label="Texture preview"></canvas>
</section>

<section>
<h2>3. Details</h2>
<label for="name">Statue name</label>
<input id="name" type="text" value="My Statue" maxlength="40">
<div class="row">
<div><label for="w">Hitbox width</label><input id="w" type="number" value="1" min="0.1" max="16" step="0.1"></div>
<div><label for="h">Hitbox height</label><input id="h" type="number" value="2" min="0.1" max="16" step="0.1"></div>
</div>
</section>

<button id="dl" disabled>Download .mcaddon</button>
<p id="msg" role="status"></p>
</main>

<script>
const $=id=>document.getElementById(id);
let geo=null, customPng=null;
const prev=$('prev'), pctx=prev.getContext('2d');

function say(t,c){const m=$('msg');m.textContent=t;m.className=c||''}
function mat(){return document.querySelector('input[name=mat]:checked').value}

// Read identifier + texture size from either geometry format
function parseGeo(json){
  const modern=json['minecraft:geometry'];
  if(Array.isArray(modern)&&modern[0]?.description?.identifier){
    const d=modern[0].description;
    return{id:d.identifier,w:d.texture_width||64,h:d.texture_height||64};
  }
  const k=Object.keys(json).find(k=>k.startsWith('geometry.'));
  if(k){
    const g=json[k];
    return{id:k.split(':')[0],w:g.texturewidth||64,h:g.textureheight||64};
  }
  throw new Error('No geometry found in this file.');
}

// Seeded noise so the texture is stable
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}

function makeTexture(type,w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d'),img=x.createImageData(w,h),r=rng(type==='gold'?7:3);
  // coarse blocks give a chunky pixel-art grain
  const bw=Math.ceil(w/4),bh=Math.ceil(h/4),blocks=[];
  for(let i=0;i<bw*bh;i++)blocks.push(r());
  for(let py=0;py<h;py++)for(let px=0;px<w;px++){
    const i=(py*w+px)*4,b=blocks[(py>>2)*bw+(px>>2)],n=r();
    let R,G,B;
    if(type==='gold'){
      const s=(Math.sin((px+py)*.55)+1)/2; // diagonal sheen
      const l=.62+b*.22+n*.1+s*.14;
      R=255*l;G=196*l;B=48*l;
      if(n>.97){R=255;G=240;B=170} // sparkle
    }else{
      const l=108+b*40+n*28;
      R=l;G=l;B=l+4;
      if(n<.04){R-=30;G-=30;B-=30} // dark flecks
    }
    img.data[i]=Math.min(255,R);img.data[i+1]=Math.min(255,G);img.data[i+2]=Math.min(255,B);img.data[i+3]=255;
  }
  x.putImageData(img,0,0);
  return c;
}

function toBytes(canvas){
  return new Promise(res=>canvas.toBlob(b=>b.arrayBuffer().then(res),'image/png'));
}

function refresh(){
  $('customBox').classList.toggle('hide',mat()!=='custom');
  const w=geo?.w||64,h=geo?.h||64;
  prev.width=w;prev.height=h;
  pctx.clearRect(0,0,w,h);
  if(mat()==='custom'){
    if(customPng){const im=new Image();im.onload=()=>pctx.drawImage(im,0,0,w,h);im.src=customPng.url}
  }else pctx.drawImage(makeTexture(mat(),w,h),0,0);
  $('dl').disabled=!geo||(mat()==='custom'&&!customPng);
}

$('geo').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const text=await f.text();
    const json=JSON.parse(text);
    const info=parseGeo(json);
    geo={...info,text};
    $('geoInfo').textContent=`Loaded ${info.id} (${info.w}×${info.h} texture).`;
    say('');
  }catch(err){
    geo=null;$('geoInfo').textContent='No model chosen.';
    say(err.message.includes('JSON')?'That file is not valid JSON. Export a .geo.json from Blockbench.':err.message,'err');
  }
  refresh();
});

$('tex').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  customPng={bytes:await f.arrayBuffer(),url:URL.createObjectURL(f)};
  refresh();
});
document.querySelectorAll('input[name=mat]').forEach(r=>r.addEventListener('change',refresh));

const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'statue';
const uuid=()=>crypto.randomUUID();

$('dl').addEventListener('click',async()=>{
  try{
    say('Building add-on…');
    const name=$('name').value.trim()||'Statue';
    const key=slug(name), ent='statue:'+key;
    const w=+$('w').value||1,h=+$('h').value||2;
    const rpId=uuid(),bpId=uuid();
    const ver=[1,0,0];

    const png=mat()==='custom'?customPng.bytes:await toBytes(makeTexture(mat(),geo.w,geo.h));

    const rpManifest={format_version:2,header:{name:name+' RP',description:'Statue textures and model',uuid:rpId,version:ver,min_engine_version:[1,21,0]},
      modules:[{type:'resources',uuid:uuid(),version:ver}]};
    const bpManifest={format_version:2,header:{name:name+' BP',description:'Statue entity and spawn egg',uuid:bpId,version:ver,min_engine_version:[1,21,0]},
      modules:[{type:'data',uuid:uuid(),version:ver}],
      dependencies:[{uuid:rpId,version:ver}]};

    const clientEntity={format_version:'1.10.0','minecraft:client_entity':{description:{
      identifier:ent,
      materials:{default:'entity_alphatest'},
      textures:{default:'textures/entity/'+key},
      geometry:{default:geo.id},
      render_controllers:['controller.render.default'],
      spawn_egg:{base_color:mat()==='gold'?'#d8a93b':'#808080',overlay_color:mat()==='gold'?'#fff1a8':'#4a4a4a'}
    }}};

    const entity={format_version:'1.21.0','minecraft:entity':{
      description:{identifier:ent,is_spawnable:true,is_summonable:true,is_experimental:false},
      components:{
        'minecraft:type_family':{family:['statue']},
        'minecraft:collision_box':{width:w,height:h},
        'minecraft:physics':{},
        'minecraft:health':{value:1000,max:1000},
        'minecraft:damage_sensor':{triggers:[{cause:'all',deals_damage:'no'}]},
        'minecraft:pushable':{is_pushable:false,is_pushable_by_piston:false},
        'minecraft:knockback_resistance':{value:1},
        'minecraft:persistent':{},
        'minecraft:nameable':{}
      }}};

    const lang=`entity.${ent}.name=${name}\nitem.spawn_egg.entity.${ent}.name=${name} Spawn Egg\n`;

    const zip=new JSZip();
    zip.file('RP/manifest.json',JSON.stringify(rpManifest,null,2));
    zip.file('RP/models/entity/'+key+'.geo.json',geo.text);
    zip.file('RP/textures/entity/'+key+'.png',png);
    zip.file('RP/entity/'+key+'.entity.json',JSON.stringify(clientEntity,null,2));
    zip.file('RP/texts/en_US.lang',lang);
    zip.file('RP/texts/languages.json','["en_US"]');
    zip.file('BP/manifest.json',JSON.stringify(bpManifest,null,2));
    zip.file('BP/entities/'+key+'.json',JSON.stringify(entity,null,2));

    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=key+'.mcaddon';
    document.body.appendChild(a);a.click();a.remove();
    say(`Downloaded ${key}.mcaddon. Open it with Minecraft, then find the "${name} Spawn Egg" in the creative inventory.`,'ok');
  }catch(err){
    say('Could not build the add-on: '+err.message,'err');
  }
});
refresh();
</script>
</body>
</html>
